name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The rotator runs on macOS with the system Python (/usr/bin/python3), as the product does.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m unittest discover -s tests -t .
      - run: node --test scripts/release.check.mjs

  # Windows: Orca ships for Windows with the same claude-profiles layout under %APPDATA%\orca. The oldest
  # and a current Python the rotator supports.
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python --version
      - run: python -m unittest discover -s tests -t .
      - run: node --test scripts/release.check.mjs

  # Cuts a release for every push to main that changes something installable: bumps package.json from
  # the conventional commits since the last tag, tags it, publishes a GitHub release and the npm
  # package. Commits pushed here with GITHUB_TOKEN do not trigger another run.
  release:
    needs: [test, test-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Publishing runs no package scripts (postinstall runs on the user's Mac), so Linux is enough.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: the job proves its identity with an OIDC token, no NPM_TOKEN secret.
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      # Each part (tag, GitHub release, npm) is checked on its own, so re-running a release that
      # failed half-way finishes the missing parts instead of reporting success with npm missing.
      - name: Plan
        id: plan
        run: |
          plan="$(node scripts/release.mjs plan)"
          echo "$plan"
          release="$(node -p "JSON.parse(process.argv[1]).release" "$plan")"
          version="$(node -p "JSON.parse(process.argv[1]).version" "$plan")"
          tagged=false; github=false; npm_has=false
          if [ "$release" = "true" ]; then
            git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null && tagged=true
            gh release view "v$version" >/dev/null 2>&1 && github=true
            npm view "claude-account-rotator@$version" version >/dev/null 2>&1 && npm_has=true
            echo "v$version: tag=$tagged github-release=$github npm=$npm_has"
            if [ "$tagged" = true ] && [ "$github" = true ] && [ "$npm_has" = true ]; then
              echo "v$version is fully released; nothing to do"
              release=false
            fi
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "tagged=$tagged"
            echo "github=$github"
            echo "npm=$npm_has"
          } >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.tagged != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs set-version "$VERSION"
          if ! git diff --quiet -- package.json README.md; then
            git add package.json README.md
            git commit -m "chore(release): v$VERSION"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          # One atomic push: main and the tag land together or not at all, so a re-run never finds one
          # without the other.
          git push --atomic origin HEAD:main "v$VERSION"

      - name: GitHub release
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.github != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --verify-tag

      # Trusted publishing (npm package settings: GitHub Actions, choiyounggi/claude-account-rotator, ci.yml)
      # needs npm 11.5.1 or later.
      - name: npm publish
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.npm != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # On a re-run the checkout predates the release commit: set the version again.
          node scripts/release.mjs set-version "$VERSION"
          npm install -g npm@^11.5.1
          npm publish --access public
          git checkout -- package.json README.md
